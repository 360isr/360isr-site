<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client Portal — 360iSR</title>
<meta name="description" content="360iSR client portal — UNCLASSIFIED // TRAINING USE ONLY." />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0A0F14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="portal-bg">
<div class="portal-router-wrap">
  <div class="portal-router">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Resolving your engagement…</h1>
    <p>One moment while we route you to the right client dashboard.</p>
  </div>
</div>
<script>
(function() {
  const CLIENT_BY_EMAIL = {
    "ewenss@icloud.com": "mindef",
    "ewen.stockbridge@gmail.com": "mindef"
  };
  const DOMAIN_FALLBACK = {
    "mindef.nl": "mindef",
    "mod.nl": "mindef",
    "nato.int": "nato"
  };
  function route(client) {
    window.location.replace("clients/" + client + "/index.html");
  }
  function resolve(email) {
    if (!email) return route("generic");
    const e = String(email).toLowerCase().trim();
    if (CLIENT_BY_EMAIL[e]) return route(CLIENT_BY_EMAIL[e]);
    const dom = e.split("@")[1] || "";
    if (DOMAIN_FALLBACK[dom]) return route(DOMAIN_FALLBACK[dom]);
    return route("generic");
  }
  // Allow ?email= override for QA
  const params = new URLSearchParams(window.location.search);
  if (params.get("email")) {
    setTimeout(function() { resolve(params.get("email")); }, 300);
    return;
  }
  fetch("/cdn-cgi/access/get-identity", { credentials: "same-origin" })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { resolve(d && d.email); })
    .catch(function() { resolve(null); });
})();
</script>
</body>
</html>
